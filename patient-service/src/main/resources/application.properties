spring.application.name=PATIENT-SERVICE
server.port=8081

# =====================================================================
# MySQL Database Configuration
# Database: mediconnect_patients_db
# =====================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/mediconnect_patients_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================================================================
# Eureka Client Configuration
# =====================================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# =====================================================================
# Swagger / OpenAPI
# =====================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# =====================================================================
# Actuator
# =====================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.mediconnect.patient=DEBUG
logging.level.org.hibernate.SQL=DEBUG
