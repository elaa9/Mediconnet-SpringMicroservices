spring.application.name=APPOINTMENT-SERVICE
server.port = 8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url = jdbc:mysql://localhost:3306/mediconnect_appointments_db?createDatabaseIfNotExist=true
spring.datasource.username = root
spring.datasource.password =
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql = true
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

eureka.instance.prefer-ip-address=true

# =====================================================================
# OpenFeign Configuration
# =====================================================================
# Enable Feign circuit breaker integration with Resilience4j
spring.cloud.openfeign.circuitbreaker.enabled=true

# Feign client timeout settings
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000

# =====================================================================
# Resilience4j Circuit Breaker Configuration
# =====================================================================
resilience4j.circuitbreaker.instances.PATIENT-SERVICE.register-health-indicator=true
resilience4j.circuitbreaker.instances.PATIENT-SERVICE.sliding-window-size=5
resilience4j.circuitbreaker.instances.PATIENT-SERVICE.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.PATIENT-SERVICE.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.PATIENT-SERVICE.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.PATIENT-SERVICE.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.DOCTOR-SERVICE.register-health-indicator=true
resilience4j.circuitbreaker.instances.DOCTOR-SERVICE.sliding-window-size=5
resilience4j.circuitbreaker.instances.DOCTOR-SERVICE.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.DOCTOR-SERVICE.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.DOCTOR-SERVICE.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.DOCTOR-SERVICE.permitted-number-of-calls-in-half-open-state=2

# =====================================================================
# Swagger / OpenAPI
# =====================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Logging
logging.level.com.mediconnect.appointment=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG
